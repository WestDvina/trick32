# -- Site Configuration --
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://WestDvina.github.io/trick32/"
theme = "congo"
defaultContentLanguage = "ru"

enableRobotsTXT = true
summaryLength = 0

[taxonomies]
  category = "categories"
  tag = "tags"

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true